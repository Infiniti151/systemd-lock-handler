name: Daily Update & Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      current_go: ${{ steps.check.outputs.current_go }}
      latest_go: ${{ steps.check.outputs.latest_go }}
      current_sysd: ${{ steps.check.outputs.current_sysd }}
      latest_sysd: ${{ steps.check.outputs.latest_sysd }}
      current_dbus: ${{ steps.check.outputs.current_dbus }}
      latest_dbus: ${{ steps.check.outputs.latest_dbus }}
      current_sys: ${{ steps.check.outputs.current_sys }}
      latest_sys: ${{ steps.check.outputs.latest_sys }}
    
    steps:
      - uses: actions/checkout@v6

      - name: Check latest versions
        id: check
        run: |
          current_go=$(grep '^go ' go.mod | awk '{print $2}')
          latest_go=$(curl -s https://go.dev/VERSION?m=text | head -n1 | sed 's/^go//')

          current_sysd=$(grep 'github.com/coreos/go-systemd' go.mod | awk '{print $2}')
          current_dbus=$(grep 'github.com/godbus/dbus' go.mod | awk '{print $2}')
          current_sys=$(grep 'golang.org/x/sys' go.mod | awk '{print $3}')

          latest_sysd=$(curl -s https://api.github.com/repos/coreos/go-systemd/tags | jq -r '.[0].name')
          latest_dbus=$(curl -s https://api.github.com/repos/godbus/dbus/tags | jq -r '.[0].name')
          latest_sys=$(curl -s https://proxy.golang.org/golang.org/x/sys/@latest | jq -r .Version)

          if (( ${#latest_go} * ${#latest_sysd} * ${#latest_dbus} * ${#latest_sys} == 0 )); then
            echo "::error::One or more latest version lookups failed (empty string)."
            echo "Go: [$latest_go] Sysd: [$latest_sysd] Dbus: [$latest_dbus] Sys: [$latest_sys]"
            exit 1
          fi

          echo "current_go=$current_go" >> $GITHUB_OUTPUT
          echo "latest_go=$latest_go" >> $GITHUB_OUTPUT
          echo "current_sysd=$current_sysd" >> $GITHUB_OUTPUT
          echo "latest_sysd=$latest_sysd" >> $GITHUB_OUTPUT
          echo "current_dbus=$current_dbus" >> $GITHUB_OUTPUT
          echo "latest_dbus=$latest_dbus" >> $GITHUB_OUTPUT
          echo "current_sys=$current_sys" >> $GITHUB_OUTPUT
          echo "latest_sys=$latest_sys" >> $GITHUB_OUTPUT

          [ $current_go$current_sysd$current_dbus$current_sys != $latest_go$latest_sysd$latest_dbus$latest_sys ] && needs_update=true || needs_update=false

          echo "needs_update=$needs_update" >> $GITHUB_OUTPUT

  build-release:
    needs: check-updates
    if: needs.check-updates.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.check-updates.outputs.latest_go }}

      - name: Import GPG key
        if: success()
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
          git_tag_gpgsign: true

      - name: Update dependencies and source code
        run: |
          if [ "${{ needs.check-updates.outputs.current_go }}" != "${{ needs.check-updates.outputs.latest_go }}" ]; then
            go mod edit -go=${{ needs.check-updates.outputs.latest_go }}
          fi

          if [ "${{ needs.check-updates.outputs.current_sysd }}" != "${{ needs.check-updates.outputs.latest_sysd }}" ]; then
            old_v=$(echo "${{ needs.check-updates.outputs.current_sysd }}" | sed -E 's/^v([0-9]+).*/\1/')
            new_v=$(echo "${{ needs.check-updates.outputs.latest_sysd }}" | sed -E 's/^v([0-9]+).*/\1/')
            
            [ "$old_v" != "$new_v" ] && sed -i "s|go-systemd/v${old_v}|go-systemd/v${new_v}|g" *.go
            
            go get -u github.com/coreos/go-systemd/v${new_v}
            rm go.sum
          fi

          if [ "${{ needs.check-updates.outputs.current_dbus }}" != "${{ needs.check-updates.outputs.latest_dbus }}" ]; then
            old_v=$(echo "${{ needs.check-updates.outputs.current_dbus }}" | sed -E 's/^v([0-9]+).*/\1/')
            new_v=$(echo "${{ needs.check-updates.outputs.latest_dbus }}" | sed -E 's/^v([0-9]+).*/\1/')
            
            [ "$old_v" != "$new_v" ] && sed -i "s|dbus/v${old_v}|dbus/v${new_v}|g" *.go
            
            go get -u github.com/godbus/dbus/v${new_v}
            rm go.sum
          fi

          if [ "${{ needs.check-updates.outputs.current_sys }}" != "${{ needs.check-updates.outputs.latest_sys }}" ]; then
            
            go get -u golang.org/x/sys@${{ needs.check-updates.outputs.latest_sys }}
            rm go.sum
          fi

          go mod tidy

      - name: Compute next release number
        id: release_number
        run: |
          git fetch --tags
          latest=$(git tag | grep '^v[0-9]\+$' | sort -V | tail -n1)
          num=${latest#v}
          next=$(( ${num:-0} + 1 ))
          echo "release_number=$next" >> $GITHUB_OUTPUT
          echo "Next release number: $next"

      - name: Run Tests
        run: |
          dbus-run-session -- make test

      - name: Commit updated files
        if: success()
        run: |
          git add .
          git commit -m "Update dependencies for release v${{ steps.release_number.outputs.release_number }}"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm debsigs
          sudo gem install --no-document fpm

      - name: Push updated files
        if: success()
        run: |
          git push
      
      - name: Configure RPM Macros
        run: |
          cat <<EOF > ~/.rpmmacros
          %_signature gpg
          %_gpg_name Infiniti151 <43163551+Infiniti151@users.noreply.github.com>
          %_gpg_path ~/.gnupg
          %__gpg $(command -v gpg)
          %__gpg_sign_args --batch --no-tty --pinentry-mode loopback
          EOF

      - name: Export public GPG key
        run: |
          gpg --batch --armor --export "43163551+Infiniti151@users.noreply.github.com" > public.key

      - name: Build, package, sign, and create checksums
        run: |
          make release VERSION=${{ steps.release_number.outputs.release_number }} 

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_number.outputs.release_number }}
          name: v${{ steps.release_number.outputs.release_number }}
          files: |
            systemd-lock-handler-v${{ steps.release_number.outputs.release_number }}.rpm
            systemd-lock-handler-v${{ steps.release_number.outputs.release_number }}.deb
            hashes.sha256.asc
            public.key
          body: |
            Release #${{ steps.release_number.outputs.release_number }}

            Built with:
            - Go version: ${{ needs.check-updates.outputs.latest_go }}
            - coreos/go-systemd: ${{ needs.check-updates.outputs.latest_sysd }}
            - godbus/dbus: ${{ needs.check-updates.outputs.latest_dbus }}
            - golang.org/x/sys: ${{ needs.check-updates.outputs.latest_sys }}

            Note:
            - sleep.target is present in the Makefile but commented out, so it is excluded from installation and packaging.
