name: Daily Update & Release

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '!go.mod'
      - '!go.sum'
      - '!Makefile'
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      changelog_exists: ${{ steps.check.outputs.changelog_exists }}
      current_go: ${{ steps.check.outputs.current_go }}
      latest_go: ${{ steps.check.outputs.latest_go }}
      current_sysd: ${{ steps.check.outputs.current_sysd }}
      latest_sysd: ${{ steps.check.outputs.latest_sysd }}
      current_dbus: ${{ steps.check.outputs.current_dbus }}
      latest_dbus: ${{ steps.check.outputs.latest_dbus }}
      current_sys: ${{ steps.check.outputs.current_sys }}
      latest_sys: ${{ steps.check.outputs.latest_sys }}
      release_body: ${{ steps.check.outputs.release_body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check latest versions & parse changelog
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=""
          NEEDS_UPDATE="false"

          # -------------------------------------------------------------
          # 1. PARSE LOCAL GO.MOD & FETCH LATEST DEPENDENCIES
          # -------------------------------------------------------------
          if [[ ! -f "go.mod" ]]; then
            echo "::error::go.mod file not found in workspace."
            exit 1
          fi

          current_go=$(grep -m1 '^go ' go.mod | awk '{print $2}')
          current_sysd=$(grep 'github.com/coreos/go-systemd' go.mod | awk '{print $2}')
          current_dbus=$(grep 'github.com/godbus/dbus' go.mod | awk '{print $2}')
          current_sys=$(grep 'golang.org/x/sys' go.mod | awk '{print $3}')

          latest_go=$(curl -s https://go.dev/VERSION?m=text | head -n1 | sed 's/^go//')
          latest_sysd=$(gh api repos/coreos/go-systemd/tags --jq '.[0].name')
          latest_dbus=$(gh api repos/godbus/dbus/tags --jq '.[0].name')
          latest_sys=$(curl -s https://proxy.golang.org/golang.org/x/sys/@latest | jq -r .Version)

          if (( ${#latest_go} * ${#latest_sysd} * ${#latest_dbus} * ${#latest_sys} == 0 )); then
            echo "::error::One or more latest version lookups failed (empty string)."
            echo "Go: [$latest_go] Sysd: [$latest_sysd] Dbus: [$latest_dbus] Sys: [$latest_sys]"
            exit 1
          fi

          # -------------------------------------------------------------
          # 2. PRINT TERMINAL SUMMARY TABLE
          # -------------------------------------------------------------
          GREEN='\e[32m'
          RED='\e[31m'
          BOLD='\e[1m'
          RESET='\e[0m'
          LINE="+----------------------+--------------+--------------+"
          FMT="| %-20s | %-12s | %-12s |\n"

          print_row() {
              local color=$RED
              [[ "$2" == "$3" ]] && color=$GREEN
              printf "${color}${FMT}${RESET}" "$1" "$2" "$3"
          }

          echo -e "\n${BOLD}Dependency Update Check${RESET}"
          echo "$LINE"
          printf "${BOLD}${FMT}${RESET}" "NAME" "CURRENT" "LATEST"
          echo "$LINE"
          print_row "go" "$current_go" "$latest_go"
          print_row "go-systemd" "$current_sysd" "$latest_sysd"
          print_row "dbus" "$current_dbus" "$latest_dbus"
          print_row "x/sys" "$current_sys" "$latest_sys"
          echo -e "$LINE\n"

          # -------------------------------------------------------------
          # 3. COMPARE LATEST TAG VS CHANGELOG VERSION
          # -------------------------------------------------------------
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_TAG_CLEAN=${LATEST_TAG#v}

          CHANGELOG_VER=""
          CHANGELOG_EXISTS="false"
          if [[ -f "CHANGELOG.md" ]]; then
            # Extract first version inside brackets e.g. ## [1.2.3]
            CHANGELOG_VER=$(grep -m1 -oP '^## \[\K[^\]]+' CHANGELOG.md || true)
          fi

          if [[ -n "$CHANGELOG_VER" && "$CHANGELOG_VER" != "$LATEST_TAG_CLEAN" ]]; then
            # New version present in CHANGELOG -> extract top entry
            BODY=$(awk '/^## \[/{count++; if (count==2) exit; next} count==1 && !/^$/' CHANGELOG.md)
            NEEDS_UPDATE="true"
            CHANGELOG_EXISTS="true"
          else
            # CHANGELOG matches latest tag (no new release notes explicitly added)
            # Check dependency diffs
            if [[ "$current_go" != "$latest_go" ]]; then
              BODY="${BODY}- Upgraded Go compiler environment from **${current_go}** to **${latest_go}**\n"
            fi
            if [[ "$current_sysd" != "$latest_sysd" ]]; then
              BODY="${BODY}- Updated \`coreos/go-systemd\` from **${current_sysd}** to **${latest_sysd}**\n"
            fi
            if [[ "$current_dbus" != "$latest_dbus" ]]; then
              BODY="${BODY}- Updated \`godbus/dbus\` from **${current_dbus}** to **${latest_dbus}**\n"
            fi
            if [[ "$current_sys" != "$latest_sys" ]]; then
              BODY="${BODY}- Updated \`x/sys\` from **${current_sys}** to **${latest_sys}**\n"
            fi

            # Check if code files changed since the tag
            CHANGED_FILES=$(git diff --name-only "$LATEST_TAG"..HEAD 2>/dev/null || true)

            if echo "$CHANGED_FILES" | grep -q "main.go"; then
              BODY="${BODY}- Updated logic in \`main.go\`\n"
            fi
            if echo "$CHANGED_FILES" | grep -q "main_test.go"; then
              BODY="${BODY}- Updated unit tests in \`main_test.go\`\n"
            fi

            if [[ "$current_go$current_sysd$current_dbus$current_sys" != "$latest_go$latest_sysd$latest_dbus$latest_sys" || -n "$BODY" ]]; then
              NEEDS_UPDATE="true"
            fi

            if [[ -z "$BODY" ]]; then
              BODY="- Workflow execution trigger. All dependencies and code remain up to date.\n"
            fi
          fi

          # -------------------------------------------------------------
          # 4. SINGLE UNIFIED OUTPUT BLOCK
          # -------------------------------------------------------------
          {
            echo "needs_update=$NEEDS_UPDATE"
            echo "changelog_exists=$CHANGELOG_EXISTS"
            echo "current_go=$current_go"
            echo "latest_go=$latest_go"
            echo "current_sysd=$current_sysd"
            echo "latest_sysd=$latest_sysd"
            echo "current_dbus=$current_dbus"
            echo "latest_dbus=$latest_dbus"
            echo "current_sys=$current_sys"
            echo "latest_sys=$latest_sys"
            echo "release_body<<EOF"
            echo -e "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-release:
    needs: check-updates
    if: |
      needs.check-updates.outputs.needs_update == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      release_number: ${{ steps.release_number.outputs.release_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.check-updates.outputs.latest_go }}
          cache: true

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Update dependencies and source code
        env:
          CURRENT_GO: ${{ needs.check-updates.outputs.current_go }}
          LATEST_GO: ${{ needs.check-updates.outputs.latest_go }}
          CURRENT_SYSD: ${{ needs.check-updates.outputs.current_sysd }}
          LATEST_SYSD: ${{ needs.check-updates.outputs.latest_sysd }}
          CURRENT_DBUS: ${{ needs.check-updates.outputs.current_dbus }}
          LATEST_DBUS: ${{ needs.check-updates.outputs.latest_dbus }}
          CURRENT_SYS: ${{ needs.check-updates.outputs.current_sys }}
          LATEST_SYS: ${{ needs.check-updates.outputs.latest_sys }}
        run: |
          if [ "$CURRENT_GO" != "$LATEST_GO" ] && [ -n "$LATEST_GO" ]; then
            go mod edit -go="$LATEST_GO"
          fi

          if [ "$CURRENT_SYSD" != "$LATEST_SYSD" ] && [ -n "$LATEST_SYSD" ]; then
            OLD_SYSD_MAJOR="${CURRENT_SYSD%%.*}"
            NEW_SYSD_MAJOR="${LATEST_SYSD%%.*}"
            if [ "$OLD_SYSD_MAJOR" != "$NEW_SYSD_MAJOR" ]; then
              sed -i "s|go-systemd/${OLD_SYSD_MAJOR}|go-systemd/${NEW_SYSD_MAJOR}|g" *.go
            fi
            go get -u "github.com/coreos/go-systemd/${NEW_SYSD_MAJOR}@${LATEST_SYSD}"
          fi

          if [ "$CURRENT_DBUS" != "$LATEST_DBUS" ] && [ -n "$LATEST_DBUS" ]; then
            OLD_DBUS_MAJOR="${CURRENT_DBUS%%.*}"
            NEW_DBUS_MAJOR="${LATEST_DBUS%%.*}"
            if [ "$OLD_DBUS_MAJOR" != "$NEW_DBUS_MAJOR" ]; then
              sed -i "s|dbus/${OLD_DBUS_MAJOR}|dbus/${NEW_DBUS_MAJOR}|g" *.go
            fi
            go get -u "github.com/godbus/dbus/${NEW_DBUS_MAJOR}@${LATEST_DBUS}"
          fi

          if [ "$CURRENT_SYS" != "$LATEST_SYS" ] && [ -n "$LATEST_SYS" ]; then
            go get -u "golang.org/x/sys@${LATEST_SYS}"
          fi

          rm -f go.sum
          go mod tidy

      - name: Compute next release number
        id: release_number
        run: |
          git fetch --tags --unshallow 2>/dev/null || git fetch --tags

          LATEST_TAG=$(git describe --tags --abbrev=0 --match="v[0-9]*")

          NUM=${LATEST_TAG#v}
          NEXT_NUM=$(( ${NUM:-0} + 1 ))

          echo "release_number=$NEXT_NUM" >> "$GITHUB_OUTPUT"
          echo "Next release number: $NEXT_NUM"

      - name: Write generated changelog to CHANGELOG.md
        if: needs.check-updates.outputs.changelog_exists != 'true'
        env:
          RAW_BODY: ${{ needs.check-updates.outputs.release_body }}
          RELEASE_NUMBER: ${{ steps.release_number.outputs.release_number }}
        run: |
          DATE_STR=$(date "+%Y-%m-%d")
          EXPANDED_BODY=$(printf "%b" "$RAW_BODY" | sed '/^$/d')

          ENTRY="## [${RELEASE_NUMBER#v}] - ${DATE_STR}\n${EXPANDED_BODY}\n"

          if [[ -f CHANGELOG.md ]]; then
            awk -v entry="$ENTRY" '
              /^# Changelog/ {
                print $0 "\n\n" entry;
                next
              }
              NR==2 && /^$/ { next }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            echo -e "# Changelog\n\n${ENTRY}" > CHANGELOG.md
          fi

      - name: Run tests
        run: |
          dbus-run-session -- make test

      - name: Append sanitized release body to spec file
        env:
          RAW_BODY: ${{ needs.check-updates.outputs.release_body }}
          RELEASE_NUMBER: ${{ steps.release_number.outputs.release_number }}
          TARGET_GO: ${{ needs.check-updates.outputs.latest_go || needs.check-updates.outputs.current_go }}
          CHLOG_NAME: ${{ steps.import-gpg.outputs.name }}
          CHLOG_EMAIL: ${{ steps.import-gpg.outputs.email }}
        run: |
          DATE_STR=$(date "+%a %b %d %Y")
          CHLOG_HDR="* $DATE_STR $CHLOG_NAME <$CHLOG_EMAIL> - ${RELEASE_NUMBER}-1"

          EXPANDED_TEXT=$(printf "%b" "$RAW_BODY")
          CLEAN_BODY=$(echo "$EXPANDED_TEXT" | sed -e 's/\\//g' -e 's/\*//g')

          sed -i "s/^Version:[[:space:]]*.*/Version:        ${RELEASE_NUMBER}/" systemd-lock-handler.spec
          if [ -n "$TARGET_GO" ]; then
            sed -i "s/^%global target_go_ver.*/%global target_go_ver ${TARGET_GO}/" systemd-lock-handler.spec
          fi

          cat <<EOF > changelog.tmp
          $CHLOG_HDR
          $CLEAN_BODY

          EOF

          sed -i '/%changelog/r changelog.tmp' systemd-lock-handler.spec
          rm -f changelog.tmp

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm debsigs
          sudo gem install --no-document fpm

      - name: Configure RPM macros
        env:
          NAME: ${{ steps.import-gpg.outputs.name }}
          EMAIL: ${{ steps.import-gpg.outputs.email }}
        run: |
          cat <<EOF > ~/.rpmmacros
          %_signature gpg
          %_gpg_name $NAME <$EMAIL>
          %_gpg_path ~/.gnupg
          %__gpg $(command -v gpg)
          %__gpg_sign_args --batch --no-tty --pinentry-mode loopback
          EOF

      - name: Build, package, sign, and create checksums
        run: |
          make release VERSION=${{ steps.release_number.outputs.release_number }}

      - name: Export public GPG key
        run: |
          gpg --batch --armor --export ${{ steps.import-gpg.outputs.email }} > out/public.key

      - name: Push updated files
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commit_message: "🤖 Automated version bump to v${{ steps.release_number.outputs.release_number }} [skip ci]"
          fail_on_self_push: false

      - name: Generate cryptographic attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            out/*.rpm
            out/*.deb
            out/systemd-lock-handler

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.release_number.outputs.release_number }}
          name: v${{ steps.release_number.outputs.release_number }}
          target_commitish: ${{ github.ref_name }}
          files: out/*
          body: |
            ### Release Notes:
            ${{ needs.check-updates.outputs.release_body }}

  trigger-copr:
    needs: [check-updates, build-release]
    if: |
      always() &&
      needs.build-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger COPR Build via API
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_PACKAGE_WEBHOOK_URL }}
          BIN_NAME: ${{ github.event.repository.name }}
          RELEASE_NUMBER: ${{ needs.build-release.outputs.release_number }}
        run: |
          if [ -z "$COPR_WEBHOOK_URL" ]; then
            echo "::error::COPR_PACKAGE_WEBHOOK_URL secret is not set! Cannot trigger build."
            exit 1
          fi

          echo "Triggering COPR build for release v${RELEASE_NUMBER}..."

          BASE_URL=$(echo "$COPR_WEBHOOK_URL" | xargs)
          FINAL_URL="${BASE_URL%/}/${BIN_NAME}/"
          MAX_RETRIES=3
          DELAY=5
          SUCCESS=false

          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i of $MAX_RETRIES..."

            if curl -fsSL -X POST "$FINAL_URL"; then
              echo "Successfully triggered COPR build!"
              SUCCESS=true
              break
            else
              echo "::warning::Attempt $i failed to reach COPR webhook."
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in ${DELAY} seconds..."
                sleep $DELAY
              fi
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "::error::Failed to trigger COPR build after $MAX_RETRIES attempts."
            exit 1
          fi
